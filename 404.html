<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; URL=/FreshCart/" />
    <script>
      const pathname = window.location.pathname.replace('/FreshCart', '');
      window.location.replace('/FreshCart/?redirect=' + pathname + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
